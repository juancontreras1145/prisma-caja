plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("PRISMA_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("PRISMA_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("PRISMA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("PRISMA_KEY_PASSWORD")
def canSignRelease = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.prismacaja.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.prismacaja.app"
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName "3.0"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
