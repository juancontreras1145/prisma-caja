name: release-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necesario
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar secretos de firma
        env:
          PRISMA_KEYSTORE_BASE64: ${{ secrets.PRISMA_KEYSTORE_BASE64 }}
          PRISMA_KEYSTORE_PASSWORD: ${{ secrets.PRISMA_KEYSTORE_PASSWORD }}
          PRISMA_KEY_ALIAS: ${{ secrets.PRISMA_KEY_ALIAS }}
          PRISMA_KEY_PASSWORD: ${{ secrets.PRISMA_KEY_PASSWORD }}
        run: |
          test -n "$PRISMA_KEYSTORE_BASE64" || (echo "Falta el secret PRISMA_KEYSTORE_BASE64" && exit 1)
          test -n "$PRISMA_KEYSTORE_PASSWORD" || (echo "Falta el secret PRISMA_KEYSTORE_PASSWORD" && exit 1)
          test -n "$PRISMA_KEY_ALIAS" || (echo "Falta el secret PRISMA_KEY_ALIAS" && exit 1)
          test -n "$PRISMA_KEY_PASSWORD" || (echo "Falta el secret PRISMA_KEY_PASSWORD" && exit 1)

      - name: Crear archivo de firma
        env:
          PRISMA_KEYSTORE_BASE64: ${{ secrets.PRISMA_KEYSTORE_BASE64 }}
        run: |
          echo "$PRISMA_KEYSTORE_BASE64" | base64 -d > app/prisma-release.jks

      - name: Compilar APK release firmado
        env:
          PRISMA_KEYSTORE_PATH: prisma-release.jks
          PRISMA_KEYSTORE_PASSWORD: ${{ secrets.PRISMA_KEYSTORE_PASSWORD }}
          PRISMA_KEY_ALIAS: ${{ secrets.PRISMA_KEY_ALIAS }}
          PRISMA_KEY_PASSWORD: ${{ secrets.PRISMA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Preparar APK del release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/PrismaCaja-${GITHUB_REF_NAME}.apk

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/PrismaCaja-${{ github.ref_name }}.apk
